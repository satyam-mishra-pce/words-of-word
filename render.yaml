services:
  - type: web
    name: words-of-word
    runtime: node
    plan: free
    buildCommand: corepack enable && corepack prepare pnpm@10.32.1 --activate && pnpm install --frozen-lockfile && pnpm --filter @wow/shared build && pnpm --filter @wow/game-engine build && pnpm --filter @wow/server build && pnpm --filter @wow/web build
    startCommand: node apps/server/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.23.0
      - key: ANALYTICS_DATABASE_URL
        fromDatabase:
          name: words-of-word-analytics
          property: connectionString
      - key: REQUIRE_DURABLE_ANALYTICS
        value: "true"

databases:
  - name: words-of-word-analytics
    plan: basic-256mb
    databaseName: words_of_word_analytics
    user: wow_analytics
    storageAutoscalingEnabled: true

services:
  - type: web
    name: words-of-word
    runtime: node
    plan: free
    buildCommand: corepack enable && corepack prepare pnpm@10.32.1 --activate && pnpm install --frozen-lockfile && pnpm lexicon:ensure && pnpm lexicon:validate && pnpm --filter @wow/shared build && pnpm --filter @wow/game-engine build && pnpm --filter @wow/lexicon build && pnpm --filter @wow/server build && pnpm --filter @wow/web build
    startCommand: node apps/server/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.23.0
      - key: LEXICON_DB_PATH
        value: packages/lexicon/artifacts/words-of-word-lexicon-v0.2.0.sqlite
      # Optional Supabase Google sign-in. Set these in the Render dashboard; when
      # absent the game runs anonymously and the sign-in UI hides itself. The
      # anon key is a public, RLS-protected client key embedded at build time.
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      # Server-side authoritative writes for streak/ELO/leaderboards. The service
      # role key is a SECRET — set it in the Render dashboard, never in git.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

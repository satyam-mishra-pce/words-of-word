<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#111111" />
    <meta name="ory-verify" content="orynth-9496996a22a04726b706897953719adb" />
    <title>Words of Word — Real-Time Word Battle</title>
    <script>
      try {
        var t = localStorage.getItem('wow-theme');
        var themes = ['amber', 'sky', 'lilac', 'mint', 'rose', 'apricot'];
        var theme = themes.indexOf(t) > -1 ? t : (t === 'light' ? 'apricot' : 'amber');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'amber');
      }
    </script>
  </head>
  <body>
    <div id="root">
      <div class="app-boot" role="status" aria-label="Opening Words of Word">
        <span>word battle</span>
        <strong>w·w</strong>
        <i></i>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

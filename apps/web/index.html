    <title>Words of Word — Real-Time Word Battle</title>
    <script>
      try {
        var t = localStorage.getItem('wow-theme');
        var theme = t || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        if (theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
      } catch (e) {}
    </script>
